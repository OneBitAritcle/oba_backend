<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title>Connecting...</title>
</head>
<body>
<p>앱으로 연결 중입니다...</p>

<script>
    const params = new URLSearchParams(window.location.search);

    const access = params.get("access");
    const refresh = params.get("refresh");

    // 모바일 앱 Deep Link 호출
    const url = `myapp://oauth?access=${access}&refresh=${refresh}`;
    window.location.href = url;

    // 앱이 안 열릴 때 대비 메시지
    setTimeout(() => {
        document.body.innerHTML = "<p>앱이 자동으로 열리지 않으면 직접 실행해주세요.</p>";
    }, 2000);
</script>
</body>
</html>
