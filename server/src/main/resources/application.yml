spring:
  application:
    name: oba-backend

  profiles:
    active: prod

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: OneBitArticle

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            # ngrok 사용 시 baseUrl 반드시 필요
            redirect-uri: "{baseUrl}/login/oauth2/code/google"

        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:1800000}
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:1209600000}

ai:
  server:
    url: ${AI_SERVER_URL}

server:
  port: ${SERVER_PORT:8080}

  # ngrok HTTPS → Spring Boot HTTP proxy 처리용
  forward-headers-strategy: framework

  # 핵심: ngrok이 로컬 스프링 서버에 연결되려면 반드시 필요
  address: 0.0.0.0

logging:
  level:
    root: INFO
