services:
  spring:
    container_name: spring_app
    build:
      context: ./server
    ports:
      - "8080:8080"
    env_file:
      - ./server/.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - ai_backend
      - ai_mongo
    networks:
      - ai_network

  ai_backend:
    container_name: ai_backend
    build:
      context: ../oba_AI
    ports:
      - "8000:8000"
    env_file:
      - ../oba_AI/.env
    networks:
      - ai_network
    command: [
      "uvicorn",
      "app:app",
      "--host", "0.0.0.0",
      "--port", "8000"
    ]

  ai_mongo:
    image: mongo:7.0
    container_name: ai_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: OneBitArticle
    networks:
      - ai_network

networks:
  ai_network:
    driver: bridge

volumes:
  mongo_data:
